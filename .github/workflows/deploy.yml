name: S-Mart CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/ksowmya-debug/smart-backend:latest
            ghcr.io/ksowmya-debug/smart-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/ksowmya-debug/smart-frontend:latest
            ghcr.io/ksowmya-debug/smart-frontend:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2 (K3s Kubernetes)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=/home/ec2-user/.kube/config
            export PATH=/usr/local/bin:$PATH

            echo "==== 1. Pulling latest code on EC2 ===="
            cd ~/S-Mart
            git pull origin main

            echo "==== 2. Applying Kubernetes Manifests ===="
            kubectl apply --validate=false -f k8s/backend.yaml
            kubectl apply --validate=false -f k8s/frontend.yaml
            kubectl apply --validate=false -f k8s/ingress.yaml

            echo "==== 3. Updating Deployment Images to Commit SHA ===="
            kubectl set image deployment/smart-backend backend=ghcr.io/ksowmya-debug/smart-backend:${{ github.sha }} -n smart
            kubectl set image deployment/smart-frontend frontend=ghcr.io/ksowmya-debug/smart-frontend:${{ github.sha }} -n smart

            echo "==== 4. Verifying Deployment Rollout ===="
            kubectl rollout status deployment/smart-backend -n smart --timeout=120s
            kubectl rollout status deployment/smart-frontend -n smart --timeout=120s

            echo "==== Deployment Successfully Verified! ===="
            kubectl get pods,svc,ingress -n smart
