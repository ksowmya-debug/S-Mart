name: S-Mart CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to AWS EC2 (K3s Kubernetes)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=/home/ec2-user/.kube/config
            export PATH=/usr/local/bin:$PATH

            echo "==== 1. Pulling latest code on EC2 ===="
            cd ~/S-Mart
            git pull origin main

            echo "==== 2. Building Docker Images ===="
            docker build -t smart-backend:latest ./backend
            docker build -t smart-frontend:latest ./frontend

            echo "==== 3. Importing Images to K3s containerd ===="
            docker save smart-backend:latest | sudo k3s ctr images import -
            docker save smart-frontend:latest | sudo k3s ctr images import -

            echo "==== 4. Applying Kubernetes Manifests ===="
            kubectl apply -f k8s/backend.yaml
            kubectl apply -f k8s/frontend.yaml
            kubectl apply -f k8s/ingress.yaml

            echo "==== 5. Verifying Deployment Rollout ===="
            kubectl rollout status deployment/smart-backend -n smart --timeout=120s
            kubectl rollout status deployment/smart-frontend -n smart --timeout=120s

            echo "==== Deployment Successfully Verified! ===="
            kubectl get pods,svc,ingress -n smart
