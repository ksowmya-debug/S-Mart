apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-backend
  namespace: smart
  labels:
    app: smart-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smart-backend
  template:
    metadata:
      labels:
        app: smart-backend
    spec:
      terminationGracePeriodSeconds: 5
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      containers:
        - name: backend
          image: ghcr.io/ksowmya-debug/smart-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: smart-backend-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smart-backend-service
  namespace: smart
  labels:
    app: smart-backend
spec:
  type: ClusterIP
  selector:
    app: smart-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
