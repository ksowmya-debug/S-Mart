apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-frontend
  namespace: smart
  labels:
    app: smart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-frontend
  template:
    metadata:
      labels:
        app: smart-frontend
    spec:
      containers:
        - name: frontend
          image: smart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: smart-frontend-service
  namespace: smart
  labels:
    app: smart-frontend
spec:
  type: ClusterIP
  selector:
    app: smart-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
